services:
  postgres:
    image: postgres:15-alpine
    container_name: kinetix_postgres
    environment:
      POSTGRES_USER: kinetix_user
      POSTGRES_PASSWORD: kinetix_password
      POSTGRES_DB: kinetix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetix_user -d kinetix_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kinetix_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kinetix_backend
    environment:
      DATABASE_URL: postgresql://kinetix_user:kinetix_password@postgres:5432/kinetix_db
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      SECRET_KEY: ${JWT_SECRET:-change-this-secret-key-in-production}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:8000/auth/strava/callback}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kinetix_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  kinetix_network:
    driver: bridge
